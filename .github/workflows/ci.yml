name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run still going (saves macOS minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || { echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -40; echo "::endgroup::"; exit 1; }
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || { grep -E "error:|failed|✘" test.log | sort -u | head -40; exit 1; }
      - name: App bundle
        run: ./scripts/build-app.sh
      - name: No private assets in the bundle
        run: |
          ls build/*.app/Contents/Resources/Characters
          test "$(ls build/*.app/Contents/Resources/Characters | tr '\n' ' ')" = "astra.notchpack cat.notchpack pebbles.notchpack "
      - name: Zip the app
        run: ditto -c -k --keepParent build/*.app build/Starnotch.zip
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Starnotch-${{ github.sha }}
          path: build/Starnotch.zip
          retention-days: 14
