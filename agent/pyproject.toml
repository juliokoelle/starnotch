[project]
name = "starnotch-agent"
version = "0.1.0"
description = "Python sidecar for Starnotch: meeting memory, live transcription and a proactive meeting agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "mcp>=1.10",
    "websockets>=13",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
